name: IVIRA CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ivira_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: ivira_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run database migrations
        run: npm run migrate
        env:
          DATABASE_URL: postgresql://ivira_test:test_password@localhost:5432/ivira_test
      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://ivira_test:test_password@localhost:5432/ivira_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret
          ADMIN_SECRET: test-admin

  build-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy-backend:
    needs: [lint-and-test-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --omit=dev
      - name: Deploy to AWS
        run: echo "TODO - Configure AWS deployment (EC2/ECS/Lambda)"
        # Future: use aws-actions/configure-aws-credentials@v4
        # Then deploy via ECS task update, EC2 SSH, or CodeDeploy

  deploy-client:
    needs: [build-client]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy client
        run: echo "TODO - Configure Vercel/S3 deployment"
        # Future: use vercel CLI or sync dist/ to S3 + CloudFront invalidation
