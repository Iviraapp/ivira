<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IVIRA | Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      padding: 40px;
      width: 100%;
      max-width: 400px;
    }
    h1 { font-size: 24px; margin-bottom: 8px; color: #111; }
    p.subtitle { color: #666; margin-bottom: 24px; font-size: 14px; }
    label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; color: #333; }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #4f46e5; }
    .otp-input {
      letter-spacing: 12px;
      font-size: 24px;
      text-align: center;
      font-weight: 600;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 16px;
      transition: background 0.2s;
    }
    button:hover { background: #4338ca; }
    button:disabled { background: #a5a3d9; cursor: not-allowed; }
    .error { color: #dc2626; font-size: 14px; margin-top: 8px; }
    .success { color: #16a34a; font-size: 14px; margin-top: 8px; }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      color: #4f46e5;
      cursor: pointer;
      font-size: 14px;
    }
    .hidden { display: none; }
    .lang-switcher {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .lang-btn {
      padding: 4px 10px;
      border: 1px solid #ddd;
      border-radius: 16px;
      font-size: 12px;
      cursor: pointer;
      background: #fff;
      color: #666;
      transition: all 0.2s;
    }
    .lang-btn:hover { border-color: #4f46e5; color: #4f46e5; }
    .lang-btn.active { background: #4f46e5; color: #fff; border-color: #4f46e5; }
    .register-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #666;
    }
    .register-link a { color: #4f46e5; text-decoration: none; font-weight: 500; }
    .register-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h1 style="letter-spacing: 2px;">IVIRA</h1>
    <p class="subtitle">Gym owner login</p>

    <div class="lang-switcher">
      <button class="lang-btn active" onclick="setLang('en')">English</button>
      <button class="lang-btn" onclick="setLang('hi')">हिन्दी</button>
      <button class="lang-btn" onclick="setLang('te')">తెలుగు</button>
      <button class="lang-btn" onclick="setLang('ta')">தமிழ்</button>
      <button class="lang-btn" onclick="setLang('kn')">ಕನ್ನಡ</button>
    </div>

    <!-- Step 1: Email -->
    <div id="step-email">
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="owner@gym.com" autofocus>
      <button id="btn-send" onclick="requestOTP()">Send OTP</button>
      <div id="email-error" class="error hidden"></div>
    </div>

    <!-- Step 2: OTP -->
    <div id="step-otp" class="hidden">
      <p class="subtitle" id="otp-sent-msg"></p>
      <label for="otp">Enter 6-digit code</label>
      <input type="text" id="otp" class="otp-input" maxlength="6" inputmode="numeric" pattern="[0-9]*">
      <button id="btn-verify" onclick="verifyOTP()">Verify & Login</button>
      <span class="back-link" onclick="showEmailStep()">Use a different email</span>
      <div id="otp-error" class="error hidden"></div>
    </div>

    <!-- Step 3: Success -->
    <div id="step-success" class="hidden">
      <p class="success" id="success-msg"></p>
    </div>

    <div class="register-link">
      New gym owner? <a href="/onboarding.html">Register your gym</a>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin + '/api/v1';
    let selectedLang = localStorage.getItem('ivira_lang') || 'en';

    function setLang(lang) {
      selectedLang = lang;
      localStorage.setItem('ivira_lang', lang);
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      document.querySelector('.lang-btn[onclick="setLang(\'' + lang + '\')"]').classList.add('active');
    }

    // Restore saved language on load
    (function() {
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      const btn = document.querySelector('.lang-btn[onclick="setLang(\'' + selectedLang + '\')"]');
      if (btn) btn.classList.add('active');
    })();

    function showError(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function hideError(id) {
      document.getElementById(id).classList.add('hidden');
    }

    function showEmailStep() {
      document.getElementById('step-email').classList.remove('hidden');
      document.getElementById('step-otp').classList.add('hidden');
      document.getElementById('step-success').classList.add('hidden');
      hideError('email-error');
    }

    async function requestOTP() {
      const email = document.getElementById('email').value.trim();
      if (!email) return showError('email-error', 'Please enter your email');
      hideError('email-error');

      const btn = document.getElementById('btn-send');
      btn.disabled = true;
      btn.textContent = 'Sending...';

      try {
        const res = await fetch(`${API_BASE}/auth/otp/email/request`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Failed to send OTP');

        document.getElementById('otp-sent-msg').textContent = `Code sent to ${email}`;
        document.getElementById('step-email').classList.add('hidden');
        document.getElementById('step-otp').classList.remove('hidden');
        document.getElementById('otp').focus();
      } catch (err) {
        showError('email-error', err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send OTP';
      }
    }

    async function verifyOTP() {
      const email = document.getElementById('email').value.trim();
      const otp = document.getElementById('otp').value.trim();
      if (!otp || otp.length !== 6) return showError('otp-error', 'Enter 6-digit code');
      hideError('otp-error');

      const btn = document.getElementById('btn-verify');
      btn.disabled = true;
      btn.textContent = 'Verifying...';

      try {
        const res = await fetch(`${API_BASE}/auth/otp/email/verify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, otp }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Invalid OTP');

        // Store JWT token
        localStorage.setItem('ivira_token', data.token);
        localStorage.setItem('ivira_gym', JSON.stringify(data.gym));

        document.getElementById('step-otp').classList.add('hidden');
        document.getElementById('success-msg').textContent =
          `Logged in as ${data.gym.gym_name}`;
        document.getElementById('step-success').classList.remove('hidden');

        // Redirect based on onboarding status
        setTimeout(() => {
          const gym = data.gym;
          if (gym.onboarding_step !== undefined && gym.onboarding_step < 4) {
            window.location.href = '/onboarding.html';
          } else {
            window.location.href = '/dashboard.html';
          }
        }, 1000);
      } catch (err) {
        showError('otp-error', err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Verify & Login';
      }
    }

    // Allow Enter key to submit
    document.getElementById('email').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') requestOTP();
    });
    document.getElementById('otp').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') verifyOTP();
    });
  </script>
</body>
</html>
