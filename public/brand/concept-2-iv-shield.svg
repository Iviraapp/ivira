<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" fill="none">
  <!--
    IVIRA — IV Shield Monogram + Wordmark
    Compact shield icon with interlocked I+V, plus full wordmark
  -->

  <!-- === SHIELD MONOGRAM === -->
  <g id="shield">
    <!-- Shield shape -->
    <path d="M12 20 Q12 8 24 8 L116 8 Q128 8 128 20 L128 88 Q128 130 70 148 Q62 156 70 148 Q12 130 12 88 Z"
          fill="#10B981"/>

    <!-- I — White knockout -->
    <rect x="32" y="28" width="18" height="80" rx="2" fill="#0A0E1A"/>

    <!-- V — White knockout, bold -->
    <polygon points="62,28 78,28 96,96 100,112 104,96 108,82 92,82 88,96 86,104 84,96 72,28"
             fill="#0A0E1A"/>
    <polygon points="66,28 80,28 98,108 82,108" fill="#0A0E1A"/>
    <polygon points="82,108 98,108 116,28 100,28" fill="#0A0E1A"/>
  </g>

  <!-- === WORDMARK === -->
  <g id="wordmark" transform="translate(160, 0)">
    <!-- I -->
    <rect x="0" y="30" width="24" height="100" rx="2" fill="#10B981"/>

    <!-- V -->
    <polygon points="52,30 74,30 92,110 98,130 104,110 122,30 144,30 104,140 92,140" fill="#10B981"/>

    <!-- I -->
    <rect x="168" y="30" width="24" height="100" rx="2" fill="#10B981"/>

    <!-- R -->
    <path d="M220 130 L220 30 L262 30 Q290 30 290 56 Q290 78 266 82 L298 130 L274 130 L246 84 L244 82 L260 82 Q268 82 268 58 Q268 52 260 52 L244 52 L244 130 Z" fill="#10B981"/>

    <!-- A -->
    <path d="M316 130 L350 30 L356 30 L390 130 L366 130 L360 110 L346 110 L340 130 Z" fill="#10B981"/>
    <rect x="342" y="88" width="22" height="20" rx="2" fill="#10B981"/>
  </g>
</svg>