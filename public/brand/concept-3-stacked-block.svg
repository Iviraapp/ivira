    <!-- I -->
    <rect x="160" y="24" width="24" height="100" rx="2" fill="#10B981"/>

    <!-- R -->
    <path d="M212 124 L212 24 L252 24 Q280 24 280 50 Q280 72 258 76 L288 124 L264 124 L238 78 L236 76 L250 76 Q260 76 260 52 Q260 46 250 46 L236 46 L236 124 Z" fill="#10B981"/>

    <!-- A -->
    <path d="M306 124 L340 24 L346 24 L380 124 L358 124 L352 106 L336 106 L330 124 Z" fill="#10B981"/>
    <rect x="332" y="84" width="24" height="18" rx="2" fill="#10B981"/>
  </g>
</svg>