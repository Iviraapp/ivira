<!-- IVIRA App Icon — Rounded square with white V mark -->
<!-- 512x512 standard app icon | Emerald #10B981 background -->
<!-- Corner radius ~22% (112px on 512) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

  <!-- Rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="#10B981"/>

  <!-- White V letterform: bold geometric, centered -->
  <polygon points="128,120 184,120 256,360 328,120 384,120 276,420 236,420" fill="#FFFFFF"/>

  <!-- White pulse dot beneath V -->
  <circle cx="256" cy="440" r="14" fill="#FFFFFF" opacity="0.6"/>

</svg>
